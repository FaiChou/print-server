<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 打印服务</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 为拖拽添加一个简单的过渡效果 */
        .drop-zone {
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4">

    <div class="w-full max-w-lg mx-auto bg-white rounded-xl shadow-lg p-8 space-y-6">
        <div class="text-center">
            <h1 class="text-3xl font-bold text-gray-800">网络打印机</h1>
            <p class="text-gray-500 mt-2">上传文件并发送到热敏打印机</p>
        </div>

        <div id="drop-zone" class="drop-zone border-2 border-dashed border-gray-300 rounded-lg p-10 text-center cursor-pointer hover:border-blue-500">
            <input type="file" id="file-input" class="hidden" accept=".pdf,.txt,.jpg,.jpeg,.png,.doc,.docx">
            <div class="flex flex-col items-center">
                <svg class="w-12 h-12 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l-3 3m3-3l3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
                </svg>                  
                <p class="mt-4 text-sm text-gray-600">
                    <span class="font-semibold text-blue-600">点击上传</span> 或拖拽文件到此处
                </p>
                <p class="text-xs text-gray-500 mt-1">也可以直接在页面上粘贴文件 (Ctrl+V)</p>
            </div>
        </div>

        <div id="file-info" class="hidden space-y-4">
            <div class="bg-gray-100 p-4 rounded-md text-sm">
                <p class="font-medium text-gray-700">已上传文件:</p>
                <p id="file-name" class="text-gray-900 truncate"></p>
            </div>
            <button id="print-button" disabled class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:bg-gray-400 disabled:cursor-not-allowed hover:bg-blue-700 transition-colors">
                打印
            </button>
        </div>

        <div id="status-message" class="text-center text-sm font-medium"></div>
    </div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const fileInfo = document.getElementById('file-info');
    const fileNameDisplay = document.getElementById('file-name');
    const printButton = document.getElementById('print-button');
    const statusMessage = document.getElementById('status-message');

    // 保存上传成功后服务器返回的文件名
    let serverFilename = null;

    // --- 事件监听 ---

    // 1. 点击上传
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
            handleFileUpload(fileInput.files[0]);
        }
    });

    // 2. 拖拽上传
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('border-blue-500', 'bg-blue-50');
    });
    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('border-blue-500', 'bg-blue-50');
    });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('border-blue-500', 'bg-blue-50');
        if (e.dataTransfer.files.length > 0) {
            handleFileUpload(e.dataTransfer.files[0]);
        }
    });
    
    // 3. 粘贴上传
    window.addEventListener('paste', (e) => {
        if (e.clipboardData && e.clipboardData.files.length > 0) {
            e.preventDefault();
            handleFileUpload(e.clipboardData.files[0]);
        }
    });

    // 打印按钮点击事件
    printButton.addEventListener('click', handlePrint);

    // --- 核心函数 ---

    // 处理文件上传的函数
    async function handleFileUpload(file) {
        resetUI();
        setStatus('正在上传...', 'text-blue-600');

        const formData = new FormData();
        formData.append('file', file);

        try {
            const response = await fetch('/upload', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (result.success) {
                serverFilename = result.filename; // 保存服务端文件名
                fileNameDisplay.textContent = result.originalName;
                fileInfo.classList.remove('hidden');
                printButton.disabled = false;
                setStatus('上传成功！请点击打印。', 'text-green-600');
            } else {
                throw new Error(result.message);
            }
        } catch (error) {
            console.error('上传失败:', error);
            setStatus(`上传失败: ${error.message}`, 'text-red-600');
            resetUI();
        }
    }

    // 处理打印的函数
    async function handlePrint() {
        if (!serverFilename) return;

        printButton.disabled = true;
        setStatus('正在发送到打印机...', 'text-blue-600');

        try {
            const response = await fetch('/print', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename: serverFilename })
            });
            
            const result = await response.json();

            if (result.success) {
                // 打印成功后的回调提示
                setStatus(`打印成功！\n${result.message}`, 'text-green-600');
                // 可以选择在打印成功后自动重置界面
                setTimeout(resetUI, 5000); // 5秒后重置
            } else {
                throw new Error(result.message);
            }
        } catch (error) {
            console.error('打印失败:', error);
            setStatus(`打印失败: ${error.message}`, 'text-red-600');
            printButton.disabled = false; // 打印失败，允许重试
        }
    }

    // 设置状态信息的辅助函数
    function setStatus(message, colorClass) {
        statusMessage.textContent = message;
        statusMessage.className = `text-center text-sm font-medium ${colorClass}`;
    }

    // 重置界面的函数
    function resetUI() {
        fileInput.value = ''; // 清空文件选择
        fileInfo.classList.add('hidden');
        printButton.disabled = true;
        fileNameDisplay.textContent = '';
        serverFilename = null;
        setStatus('', '');
    }

</script>

</body>
</html>

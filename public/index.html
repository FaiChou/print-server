<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 打印服务</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 为拖拽添加一个简单的过渡效果 */
        .drop-zone {
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }

        .visually-hidden {
            position: absolute;
            clip-path: inset(50%);
            overflow: hidden;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            border: 0;
            white-space: nowrap;
        }

        .scaling-option {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.375rem 0.875rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            line-height: 1.25;
            color: #4b5563;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
        }

        .scaling-option:hover {
            color: #111827;
        }

        .scaling-option:has(:checked) {
            background-color: #ffffff;
            color: #1d4ed8;
            font-weight: 600;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(0, 0, 0, 0.04);
        }

        .scaling-option:has(:focus-visible) {
            outline: 2px solid #2563eb;
            outline-offset: 2px;
        }

        .scaling-toggle:disabled {
            opacity: 0.6;
        }

        .scaling-toggle:disabled .scaling-option {
            cursor: not-allowed;
        }

        @media (pointer: coarse) {
            .scaling-option {
                min-height: 44px;
                padding: 0.5rem 1rem;
            }
        }

        #file-list {
            max-height: min(16rem, 35vh);
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            --scrollbar-thumb: #6b7280;
            --scrollbar-track: #f3f4f6;
            scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
            scrollbar-width: auto;
        }

        @supports not (scrollbar-color: auto) {
            #file-list::-webkit-scrollbar {
                width: 10px;
                height: 10px;
            }

            #file-list::-webkit-scrollbar-thumb {
                background: var(--scrollbar-thumb);
                border-radius: 9999px;
            }

            #file-list::-webkit-scrollbar-track {
                background: var(--scrollbar-track);
            }
        }
    </style>
</head>
<body class="min-h-full bg-gray-50 flex flex-col p-4 sm:p-6">

    <header class="w-full flex justify-end mb-4 sm:mb-0">
        <fieldset id="print-scaling-group" class="scaling-toggle inline-flex items-center p-1 rounded-full bg-gray-200/80 border border-gray-300/80 shadow-sm">
            <legend class="visually-hidden">打印缩放模式</legend>
            <label class="scaling-option" title="适应页面：等比缩放到铺满纸宽（小图会放大，大图会缩小）">
                <input type="radio" name="printScaling" value="fit" class="visually-hidden" checked>
                <span>fit</span>
            </label>
            <label class="scaling-option" title="自动适应：仅超尺寸时缩小，小图保持原大小">
                <input type="radio" name="printScaling" value="auto-fit" class="visually-hidden">
                <span>auto-fit</span>
            </label>
        </fieldset>
    </header>

    <main class="flex-1 flex items-center justify-center">
    <div class="w-full max-w-lg mx-auto bg-white rounded-xl shadow-lg p-8 space-y-6">
        <div class="text-center">
            <h1 class="text-3xl font-bold text-gray-800">网络打印机</h1>
            <p class="text-gray-500 mt-2">上传文件并发送到热敏打印机</p>
        </div>

        <div id="drop-zone" class="drop-zone border-2 border-dashed border-gray-300 rounded-lg p-10 text-center cursor-pointer hover:border-blue-500">
            <input type="file" id="file-input" class="hidden" accept=".pdf,.txt,.jpg,.jpeg,.png,.doc,.docx" multiple>
            <div class="flex flex-col items-center">
                <svg class="w-12 h-12 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l-3 3m3-3l3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
                </svg>                  
                <p class="mt-4 text-sm text-gray-600">
                    <span class="font-semibold text-blue-600">点击上传</span> 或拖拽文件到此处
                </p>
                <p class="text-xs text-gray-500 mt-1">支持批量上传多个文件，也可以直接在页面上粘贴文件 (Ctrl+V)</p>
            </div>
        </div>

        <div id="file-list-container" class="hidden space-y-4">
            <div class="bg-gray-50 p-4 rounded-md">
                <p class="font-medium text-gray-700 mb-3">已上传文件 (<span id="file-count">0</span>):</p>
                <div id="file-list" class="space-y-2 pr-1"></div>
            </div>
            <button id="print-button" disabled class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:bg-gray-400 disabled:cursor-not-allowed hover:bg-blue-700 transition-colors">
                按顺序打印所有文件
            </button>
        </div>

        <div id="status-message" role="status" aria-live="polite" class="text-center text-sm font-medium"></div>
    </div>
    </main>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const fileListContainer = document.getElementById('file-list-container');
    const fileList = document.getElementById('file-list');
    const fileCount = document.getElementById('file-count');
    const printButton = document.getElementById('print-button');
    const printScalingGroup = document.getElementById('print-scaling-group');
    const statusMessage = document.getElementById('status-message');

    // 文件列表：存储 { file, serverFilename, originalName, status }
    // status: 'pending' | 'uploading' | 'uploaded' | 'printing' | 'printed' | 'error'
    let files = [];
    let isUploading = false;

    // --- 事件监听 ---

    // 1. 点击上传
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
            handleFiles(Array.from(fileInput.files));
            fileInput.value = '';
        }
    });

    // 2. 拖拽上传
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('border-blue-500', 'bg-blue-50');
    });
    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('border-blue-500', 'bg-blue-50');
    });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('border-blue-500', 'bg-blue-50');
        if (e.dataTransfer.files.length > 0) {
            handleFiles(Array.from(e.dataTransfer.files));
        }
    });
    
    // 3. 粘贴上传
    window.addEventListener('paste', (e) => {
        if (e.clipboardData && e.clipboardData.files.length > 0) {
            e.preventDefault();
            handleFiles(Array.from(e.clipboardData.files));
        }
    });

    // 打印按钮点击事件
    printButton.addEventListener('click', handlePrintAll);

    // --- 核心函数 ---

    // 处理多个文件
    function handleFiles(newFiles) {
        // 添加文件到列表
        newFiles.forEach(file => {
            files.push({
                file: file,
                serverFilename: null,
                originalName: file.name,
                status: 'pending'
            });
        });

        updateFileList();
        // 自动开始上传
        uploadPendingFiles();
    }

    // 上传待处理的文件
    async function uploadPendingFiles() {
        if (isUploading) return;
        isUploading = true;

        try {
            while (true) {
                const fileItem = files.find(f => f.status === 'pending');
                if (!fileItem) break;

                fileItem.status = 'uploading';
                updateFileList();
                await handleFileUpload(fileItem);
            }
        } finally {
            isUploading = false;
        }
    }

    // 处理单个文件上传
    async function handleFileUpload(fileItem) {
        setStatus(`正在上传: ${fileItem.originalName}...`, 'text-blue-600');

        const formData = new FormData();
        formData.append('file', fileItem.file);

        try {
            const response = await fetch('/upload', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (result.success) {
                fileItem.serverFilename = result.filename;
                fileItem.status = 'uploaded';
                updateFileList();
                setStatus(`上传成功: ${fileItem.originalName}`, 'text-green-600');
            } else {
                throw new Error(result.message);
            }
        } catch (error) {
            console.error('上传失败:', error);
            fileItem.status = 'error';
            updateFileList();
            setStatus(`上传失败: ${fileItem.originalName} - ${error.message}`, 'text-red-600');
        }
    }

    // 按顺序打印所有文件
    async function handlePrintAll() {
        const uploadedFiles = files.filter(f => f.status === 'uploaded');
        if (uploadedFiles.length === 0) {
            setStatus('没有可打印的文件', 'text-red-600');
            return;
        }

        const selectedScaling = printScalingGroup.querySelector('input[name="printScaling"]:checked');
        const printScaling = selectedScaling ? selectedScaling.value : 'fit';
        printButton.disabled = true;
        printScalingGroup.disabled = true;
        setStatus(`准备打印 ${uploadedFiles.length} 个文件...`, 'text-blue-600');

        let successCount = 0;
        let failCount = 0;

        try {
            for (let i = 0; i < uploadedFiles.length; i++) {
                const fileItem = uploadedFiles[i];
                fileItem.status = 'printing';
                updateFileList();
                setStatus(`正在打印 (${i + 1}/${uploadedFiles.length}): ${fileItem.originalName}...`, 'text-blue-600');

                try {
                    const response = await fetch('/print', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            filename: fileItem.serverFilename,
                            printScaling
                        })
                    });
                    
                    const result = await response.json();

                    if (result.success) {
                        fileItem.status = 'printed';
                        successCount++;
                        updateFileList();
                    } else {
                        throw new Error(result.message);
                    }
                } catch (error) {
                    console.error('打印失败:', error);
                    fileItem.status = 'error';
                    failCount++;
                    updateFileList();
                }

                // 在打印之间添加短暂延迟，避免打印机过载
                if (i < uploadedFiles.length - 1) {
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
            }

            // 打印完成
            if (failCount === 0) {
                setStatus(`所有文件打印完成！共 ${successCount} 个文件`, 'text-green-600');
            } else {
                setStatus(`打印完成：成功 ${successCount} 个，失败 ${failCount} 个`, 'text-yellow-600');
            }
        } finally {
            printScalingGroup.disabled = false;
            printButton.disabled = false;
        }
    }

    // 删除文件
    function removeFile(index) {
        files.splice(index, 1);
        updateFileList();
        if (files.length === 0) {
            fileListContainer.classList.add('hidden');
            setStatus('', '');
        }
    }

    // 更新文件列表显示
    function updateFileList() {
        if (files.length === 0) {
            fileListContainer.classList.add('hidden');
            printButton.disabled = true;
            return;
        }

        fileListContainer.classList.remove('hidden');
        fileCount.textContent = files.length;

        fileList.innerHTML = '';
        files.forEach((fileItem, index) => {
            const fileItemDiv = document.createElement('div');
            fileItemDiv.className = 'flex items-center justify-between bg-white p-3 rounded border border-gray-200';

            const statusColors = {
                'pending': 'text-gray-500',
                'uploading': 'text-blue-600',
                'uploaded': 'text-green-600',
                'printing': 'text-blue-600',
                'printed': 'text-green-600',
                'error': 'text-red-600'
            };

            const statusTexts = {
                'pending': '等待上传',
                'uploading': '上传中...',
                'uploaded': '已上传',
                'printing': '打印中...',
                'printed': '已打印',
                'error': '错误'
            };

            const statusIcon = fileItem.status === 'uploaded' || fileItem.status === 'printed' 
                ? '✓' 
                : fileItem.status === 'error' 
                ? '✗' 
                : fileItem.status === 'uploading' || fileItem.status === 'printing'
                ? '⟳'
                : '○';

            fileItemDiv.innerHTML = `
                <div class="flex items-center space-x-3 flex-1 min-w-0">
                    <span class="text-sm font-medium ${statusColors[fileItem.status]}">${statusIcon}</span>
                    <span class="text-sm text-gray-700 truncate flex-1" title="${fileItem.originalName}">${index + 1}. ${fileItem.originalName}</span>
                    <span class="text-xs ${statusColors[fileItem.status]}">${statusTexts[fileItem.status]}</span>
                </div>
                ${fileItem.status !== 'uploading' && fileItem.status !== 'printing' ? `
                    <button onclick="removeFile(${index})" class="ml-2 text-red-500 hover:text-red-700 text-sm font-medium">
                        删除
                    </button>
                ` : ''}
            `;

            fileList.appendChild(fileItemDiv);
        });

        // 更新打印按钮状态
        const hasUploadedFiles = files.some(f => f.status === 'uploaded');
        printButton.disabled = !hasUploadedFiles || files.some(f => f.status === 'printing');
    }

    // 设置状态信息的辅助函数
    function setStatus(message, colorClass) {
        statusMessage.textContent = message;
        statusMessage.className = `text-center text-sm font-medium ${colorClass}`;
    }

    // 将 removeFile 函数暴露到全局作用域，以便在 HTML 中调用
    window.removeFile = removeFile;

</script>

</body>
</html>
